 mimari, yemek, teknoloji ve yaşam tarzı gibi birçok konuyu içine alan bir kavramdır. 19. ve 20. yüzyıllarda moda dünyası gelişmiş ve ilk moda evleri açılmıştır."], ["1920’li yıllarda", "insanlar modayı takip etmeye başlamıştır. Bu dönemin en önemli değişimi kadınların pantolon giymesidir. Modayı takip eden kadınlar abiye elbiseler, kürkler ve dantelli eldivenler giymiştir."], ["1930’lu yıllarda", "küçük, süslü şapkalar ve uzun elbiseler popüler olmuştur."], ["1940’lı yıllarda", "insanlar tek tip giyinmeye başlamıştır. Üniformalar, kemerler ve büyük şapkalar dönemin modasını oluşturmuştur. Dünyada yaşanan olaylar da modayı etkilemiştir. Örneğin, II. Dünya Savaşı nedeniyle Amerikan saç kesimi popüler olmuştur."], ["1950’li yıllarda", "siyah renk ve ince belli olmak moda olmuştur. İnce belli görünmek isteyen kadınlar korse kullanmıştır."], ["1960’lı yıllarda", "insanların uzaya gitme isteği modayı etkilemiştir. Modacılar uzay temasını yansıtan kıyafetler tasarlamıştır. Farklı şapkaları, eldivenleri ve göz makyajıyla dikkat çeken Audrey Hepburn, dönemin moda ikonu olmuştur."], ["1970’li yıllarda", "Hippi akımıyla birlikte insanlar daha özgür giyinmeye başlamıştır. Uzun ve bol etekler, mücevherler ve desenli fularlar popüler olmuştur. Döneme damgasını vuran kıyafetlerden biri de İspanyol paça pantolonlardır."], ["1980’li yıllar", "gösteriş çağıdır. Dikkat çeken aksesuarlar, kabarık saçlar ve parlak renkler bu dönemin en önemli özellikleridir."], ["1990’lı yıllarda", "sade ve rahat giyinmek moda olmuştur. Rahatlığı tercih eden insanlar beyaz tişörtler, denizci gömlekleri ve yüksek belli kot pantolonlar giymiştir."], ["2000’li yıllarda", "insanlar kendi tarzlarını yaratmaya başlamıştır. Geçmiş yıllarda popüler olan kıyafetler yeniden moda olmuştur."], ["", "Günümüzde moda, pahalı ve gösterişli giyinmek anlamına gelmez. İnsanlar kendilerine yakışan, zevklerine uyan ve kendilerini rahat hissettiren kıyafetleri tercih etmektedir."]], "suffix": [["Şapka tak___ kadın", "The wo const sounds=Object.fromEntries(Object.entries(DATA.audio).map(([k,v])=>[k,new Audio(v)]));let muted=false,level=0,index=0,questions={},busy=false,epoch=0,selected=null,placed=new Set(),pool=[],drag=null,readingPage=0;const names=['','Vocabulary','Fill in the Blanks','Fashion Timeline','Discover the Grammar','Choose the Correct Suffix','Combine the Sentences','Translate into Turkish'];

function start(){epoch++;questions={1:shuffle(DATA.vocab.flatMap(([en,tr,td,ed])=>[{q:en,a:tr,b:td},{q:tr,a:en,b:ed}])),2:shuffle(DATA.blanks.map(([q,a,b])=>({q,a,b}))),5:shuffle(DATA.suffix.map(([q,sub,a,b])=>({q,sub,a,b}))),6:shuffle(DATA.combine),7:shuffle(DATA.translate)};pool=shuffle(DATA.timeline.map((_,i)=>i));placed=new Set();selected=null;level=1;index=0;render()}
function total(){return level===3?9:level===4?5:questions[level]?.length||1}function shell(content,cls=''){let n=level===3?placed.size:index;app.className='frame';app.innerHTML=`<header class="header"><span class="brand">FASHION</span><span class="leveltag">LEVEL ${level} / 7 · ${level===3?n:Math.min(n+1,total())} / ${total()}</span><button class="sound" aria-label="Sesi aç veya kapat" aria-pressed="${muted}">${muted?'Ses kapalı':'Ses açık'}</button></header><div class="progress" role="progressbar" aria-valuenow="${n}" aria-valuemax="${total()}"><span style="width:${100*n/total()}%"></span></div><section class="content ${cls}">${content}</section>`;$('.sound').onclick=()=>{muted=!muted;$('.sound').textContent=muted?'Ses kapalı':'Ses açık';$('.sound').setAttribute('aria-pressed',muted);if(muted){Object.values(sounds).forEach(a=>a.pause())}}}
function feedback(t,bad=false){let el=$('.feedback');if(el){el.textContent=t;el.classList.toggle('error',bad)}}function later(fn,ms){let token=epoch;setTimeout(()=>{if(token===epoch)fn()},ms)}function next(){index++;if(index>=total())complete();else render()}
function complete(){busy=true;epoch++;play('level');if(level===7){app.innerHTML='<section class="finish"><h1>Well done!</h1><button class="metal" id="restart">Tekrar başla</button></section>';$('#restart').onclick=start;return}app.innerHTML=`<section class="transition"><h1>Level ${level} completed</h1><p>Level ${level+1} · ${names[level+1]}</p></section>`;later(()=>{level++;index=0;render()},1450)}
function choices(a,b){return `<div class="options">${shuffle([a,b]).map(x=>`<button class="choice" data-answer="${esc(x)}">${esc(x)}</button>`).join('')}</div>`}function hookChoices(q,advance=next){document.querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>{if(busy)return;let good=btn.dataset.answer===q.a;busy=true;btn.classList.add(good?'good':'bad');play(good?'correct':'wrong');feedback(good?'Doğru!':'Tekrar dene.',!good);if(good){let gap=$('.blank');if(gap){gap.textContent=level===5?q.a.slice(1):q.a;gap.style.borderBottom='none'}later(advance,850)}else later(()=>{btn.classList.remove('bad');feedback('');busy=false},650)})}
function blank(q){return esc(q).replace('___','<span class="blank">&nbsp;</span>')}
function quiz(){let q=questions[level][index];shell(`<h1 class="question">${blank(q.q)}</h1>${q.sub?`<div class="sub">${esc(q.sub)}</div>`:''}${choices(q.a,q.b)}<div class="feedback" role="status" aria-live="polite"></div>`);hookChoices(q)}

function timeline(){shell(`<div class="timeline-tools"><strong>Moda Zaman Çizelgesi</strong><button class="small" id="read">Metni oku</button></div><div class="timeline">${DATA.timeline.map(([y,t],i)=>`<div class="year"><div class="year-label">${esc(y)}</div><div class="dot"></div><button class="tile ${placed.has(i)?'good':''}" data-year="${i}" aria-label="${esc(y)}" ${placed.has(i)?'disabled':''}>${placed.has(i)?esc(t):''}</button></div>`).join('')}</div><div class="pool">${pool.map(i=>`<button class="dragcard ${placed.has(i)?'used':''} ${selected===i?'selected':''}" data-card="${i}" ${placed.has(i)?'disabled':''}>${esc(DATA.timeline[i][1])}</button>`).join('')}</div><div class="feedback" role="status"></div>`,'timeline-content');$('#read').onclick=openReading;document.querySelectorAll('.tile').forEach(e=>e.onclick=()=>{if(selected!==null)match(selected,Number(e.dataset.year))});document.querySelectorAll('.dragcard:not(.used)').forEach(e=>{e.addEventListener('pointerdown',pointerDown);e.addEventListener('pointermove',pointerMove);e.addEventListener('pointerup',pointerUp);e.addEventListener('pointercancel',clearDrag);e.addEventListener('click',ev=>{if(ev.detail===0)selectCard(Number(e.dataset.card))})})}
function selectCard(i){if(busy||placed.has(i))return;selected=i;document.querySelectorAll('.dragcard').forEach(e=>e.classList.toggle('selected',Number(e.dataset.card)===i))}
function pointerDown(e){if(busy||e.button!==0)return;let el=e.currentTarget,i=Number(el.dataset.card);drag={i,x:e.clientX,y:e.clientY,el,pid:e.pointerId,ghost:null};el.setPointerCapture(e.pointerId)}function pointerMove(e){if(!drag||e.pointerId!==drag.pid)return;if(!drag.ghost&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){selectCard(drag.i);let g=document.createElement('div');g.className='dragcard ghost';g.textContent=DATA.timeline[drag.i][1];document.body.append(g);drag.ghost=g}if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';let target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.tile');document.querySelectorAll('.tile').forEach(el=>el.classList.toggle('target',el===target&&!el.disabled))}}
function clearDrag(){if(drag?.ghost)drag.ghost.remove();drag=null;document.querySelectorAll('.tile.target').forEach(e=>e.classList.remove('target'))}
function pointerUp(e){if(!drag||e.pointerId!==drag.pid)return;let i=drag.i,was=!!drag.ghost,target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.tile');clearDrag();if(was&&target&&!target.disabled)match(i,Number(target.dataset.year));else selectCard(i)}
function match(i,y){if(busy||placed.has(i)||placed.has(y))return;busy=true;let tile=$(`[data-year="${y}"]`);if(i===y){placed.add(i);selected=null;play('correct');timeline();feedback('Doğru!');later(()=>{if(placed.size===9)complete();else{busy=false;feedback('')}},700)}else{tile.classList.add('bad');play('wrong');feedback('Tekrar dene.',true);selected=null;document.querySelectorAll('.dragcard').forEach(e=>e.classList.remove('selected'));later(()=>{tile.classList.remove('bad');feedback('');busy=false},650)}}
function oral(){let item=questions[level][index],arr=Array.isArray(item)?item:[item];shell(`${arr.map(x=>`<h1 class="question">${esc(x)}</h1>`).join('')}<button class="metal" id="continue">Devam</button>`);$('#continue').onclick=next}
function render(){busy=false;epoch++;if([1,2,5].includes(level))quiz();else if(level===3)timeline();else if(level===4)grammarScreen();else oral()}
app.className='frame';app.innerHTML='<section class="start"><button class="metal" id="start">START</button></section>';$('#start').onclick=start;
</script></body></html>
